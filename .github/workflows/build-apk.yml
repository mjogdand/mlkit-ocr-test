name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mlkit-ocr-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mlkit-ocr-test-apk
          path: mlkit-ocr-test.apk

      # A release gives a direct download link that works from a phone browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ML Kit OCR test build ${{ github.run_number }}
          files: mlkit-ocr-test.apk
          make_latest: true
